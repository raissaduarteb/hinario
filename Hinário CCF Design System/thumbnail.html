<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0;width:1280px;height:854px;overflow:hidden}
  .tile{display:flex;width:1280px;height:854px}
  .main{flex:1;background:var(--l1);display:flex;align-items:center;justify-content:center}
  .main img{width:70%;max-width:760px;height:auto;object-fit:contain}
  .strip{display:flex;flex-direction:column;width:150px}
  .strip div{flex:1}
</style></head><body>
<div class="tile">
  <div class="main"><img src="assets/brand/logo-ad33.png" alt="Comunidade Cristã em Fortaleza"></div>
  <div class="strip">
    <div style="background:var(--peach)"></div>
    <div style="background:var(--c3)"></div>
    <div style="background:var(--c6)"></div>
    <div style="background:var(--c9)"></div>
  </div>
</div>
</body></html>
