<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces & lines" subtitle="App background, cards, hairlines" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);background:var(--surface-app)}.wrap{display:flex;gap:16px;padding:24px}.sw{flex:1;border-radius:12px;height:96px;box-sizing:border-box;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid var(--border-hairline)}.name{font-weight:600;font-size:12px;color:var(--text-primary)}.val{font-size:11px;color:var(--text-muted)}</style>
</head><body><div class="wrap">
<div class="sw" style="background:var(--fa)"><span class="name">--surface-app</span><span class="val">rgb(250,250,250)</span></div>
<div class="sw" style="background:var(--w)"><span class="name">--surface-card</span><span class="val">rgb(255,255,255)</span></div>
<div class="sw" style="background:var(--df)"><span class="name">--border-hairline</span><span class="val">rgb(223,223,223)</span></div>
<div class="sw" style="background:rgb(45,45,45)"><span class="name" style="color:#fff">dark surface</span><span class="val" style="color:#bbb">rgb(45,45,45)</span></div>
</div></body></html>
