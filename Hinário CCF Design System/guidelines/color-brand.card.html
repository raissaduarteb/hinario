<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);background:var(--surface-app)}.wrap{display:flex;gap:16px;padding:24px}.sw{flex:1;border-radius:12px;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;height:96px;box-sizing:border-box}.name{font-weight:600;font-size:13px}.val{font-size:12px;opacity:.85}</style>
</head><body><div class="wrap">

<div class="sw" style="background:rgba(233,78,26,.55);color:#fff"><span class="name">soft badge</span><span class="val">l1 @ 55%</span></div>
</div></body></html>
